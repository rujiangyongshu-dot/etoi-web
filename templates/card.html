<a class="card" href="{{ root }}works/{{ w.slug }}/">
  <span class="card-img"><img src="{{ root }}static/img/{{ w.no }}/thumb.jpg" alt="{{ w.title_ja }}（{{ w.artist_ja }}）" loading="lazy"></span>
  <span class="card-theme">{{ w.theme_name }}</span>
  <span class="card-hook">{{ w.slides[0].t[0] }}{{ w.slides[0].t[1] }}</span>
  <span class="card-meta">{{ w.title_ja }}｜{{ w.artist_ja }}</span>
</a>
